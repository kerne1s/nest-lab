services:
  db:
    image: postgres:17-alpine
    container_name: nest-lab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: nest_lab
    ports:
      # 5433 снаружи, чтобы не конфликтовать с локальным Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d nest_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
